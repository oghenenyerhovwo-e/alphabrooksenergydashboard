<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12190f" />
    <title>Offline — Alpha Brooks Energy</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: #f5f6f1; color: #16201b;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .card {
        max-width: 380px; margin: 24px; padding: 32px 28px; text-align: center;
        background: #fff; border: 1px solid #e1e5da; border-radius: 14px;
        box-shadow: 0 2px 10px rgba(22, 32, 27, 0.06);
      }
      .mark {
        width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(155deg, #4cb522 0%, #245c0f 100%);
        color: #0d1509; font-weight: 800; font-size: 20px;
      }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 20px; color: #667167; font-size: 14px; line-height: 1.5; }
      button {
        border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
        background: #2f7a14; color: #fff; font-size: 14px; font-weight: 600;
      }
      button:hover { background: #245c0f; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">AB</div>
      <h1>You're offline</h1>
      <p>
        Alpha Brooks Energy needs an internet connection to load live
        operations data. Check your connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
